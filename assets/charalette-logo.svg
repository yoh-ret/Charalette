        fill="none" stroke="url(#cWash)" stroke-width="21" stroke-linecap="round" filter="url(#handmade)"/>
  <circle cx="201" cy="91" r="10" fill="#F6BDD5"/>
  <circle cx="218" cy="119" r="9" fill="#CBEBDD"/>
  <circle cx="203" cy="147" r="8" fill="#C9E8F2"/>
  <circle cx="197" cy="87" r="3" fill="#FFF9F5" fill-opacity="0.72"/>
  <circle cx="215" cy="116" r="2.5" fill="#FFF9F5" fill-opacity="0.72"/>

  <!-- Custom monoline lettering: readable at small sizes, with slight hand-made variation. -->
  <g fill="none" stroke="url(#inkWash)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#handmade)">
    <!-- h -->
    <path d="M246 184 C254 151 263 104 268 57 C270 42 280 40 280 56 C278 89 270 123 265 149 C278 122 299 108 313 116 C327 124 317 153 319 170 C320 181 331 178 345 160"/>
    <!-- a -->
    <path d="M345 158 C351 132 369 115 387 117 C406 120 407 143 396 163 C387 180 368 184 359 173 C349 161 355 140 369 129 C384 117 399 125 399 141 C398 160 399 180 414 181 C424 182 435 169 443 158"/>
    <!-- r -->
    <path d="M443 180 C449 158 452 137 454 117 C455 140 458 151 465 145 C473 137 475 117 487 115 C499 113 508 123 504 136"/>
    <!-- a -->
    <path d="M505 158 C511 132 529 115 547 117 C566 120 567 143 556 163 C547 180 528 184 519 173 C509 161 515 140 529 129 C544 117 559 125 559 141 C558 160 559 180 574 181 C584 182 595 169 603 158"/>
    <!-- l -->
    <path d="M604 179 C612 148 622 101 625 58 C626 43 617 42 613 56 C605 84 610 114 623 133 C632 147 644 153 654 149 C646 157 637 166 630 174 C624 182 633 187 645 182 C655 178 663 168 670 157"/>
    <!-- e -->
    <path d="M670 151 C689 153 706 146 708 132 C710 121 700 115 690 120 C676 128 671 154 680 169 C689 184 712 181 728 160"/>
    <!-- t -->
    <path d="M738 86 C736 113 731 148 731 167 C731 179 740 182 751 175 C760 170 768 163 774 155 M716 120 C738 119 758 116 774 112"/>
