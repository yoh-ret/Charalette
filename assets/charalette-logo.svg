<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Charalette</title>
  <desc id="desc">手描きのCと、やわらかな筆記体風のCharaletteワードマーク</desc>
  <defs>
    <linearGradient id="cWash" x1="60" y1="30" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B83D3"/>
      <stop offset="0.55" stop-color="#B9A7E8"/>
      <stop offset="1" stop-color="#F0AFCB"/>
    </linearGradient>
    <linearGradient id="inkWash" x1="240" y1="60" x2="1040" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6F5A74"/>
      <stop offset="0.5" stop-color="#796080"/>
      <stop offset="1" stop-color="#8A6E8C"/>
    </linearGradient>
    <filter id="handmade" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- The open C becomes the compact favicon symbol. -->
  <path d="M198 67 C164 34 104 42 76 88 C48 134 65 194 116 207 C148 216 180 205 202 181"
        fill="none" stroke="#FFF9F5" stroke-opacity="0.7" stroke-width="31" stroke-linecap="round"/>
