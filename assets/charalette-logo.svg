  <!-- A restrained finishing flourish keeps the mark light rather than ornamental. -->
  <path d="M885 159 C914 143 941 147 956 163 C969 177 984 181 1003 174"
        fill="none" stroke="#B9A7E8" stroke-opacity="0.62" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1017" cy="170" r="5" fill="#F6BDD5" fill-opacity="0.88"/>
</svg>
