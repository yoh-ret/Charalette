    <path d="M787 82 C785 111 780 148 780 167 C780 179 789 182 800 175 C809 170 817 163 823 155 M766 117 C787 116 807 113 823 109"/>
    <!-- e -->
    <path d="M824 151 C843 153 860 146 862 132 C864 121 854 115 844 120 C830 128 825 154 834 169 C843 184 867 181 884 159"/>
