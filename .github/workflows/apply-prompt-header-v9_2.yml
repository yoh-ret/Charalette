name: Apply Prompt Header OFF v9.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-prompt-header-v9_2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/prompt-header-v9_2.patch
          git apply --check /tmp/prompt-header-v9_2.patch
          git apply /tmp/prompt-header-v9_2.patch
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert '<title>Prompt Palette Prototype v9.2</title>' in s
          assert 'promptPalette.v7_5.promptHeaderEnabled' in s
          assert 'promptHeaderEnabled?FIXED_PROMPT_HEADER:""' in s
          assert 'const BACKUP_SCHEMA_VERSION = 1;' in s
          Path('/tmp/app.js').write_text(s[s.rfind('<script>')+8:s.rfind('</script>')])
          PY
          node --check /tmp/app.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-prompt-header-v9_2.yml
          git add index.html
          git commit -m "Implement Prompt Header OFF v9.2"
          git push origin main
